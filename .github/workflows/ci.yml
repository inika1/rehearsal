name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # =========================
  # BACKEND CI (Supabase)
  # =========================
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Get Supabase credentials
        id: supabase
        run: |
          SERVICE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          echo "service_role_key=$SERVICE_KEY" >> $GITHUB_OUTPUT

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Test
        run: npm test
        working-directory: backend
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}


  # =========================
  # MOBILE CI (Expo check)
  # =========================
  mobile:
    name: Mobile (Expo check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile deps
        run: npm ci
        working-directory: mobile

      - name: Expo export check (web)
        run: npx expo export --platform web 
        working-directory: mobile


  # =========================
  # DEPLOY BACKEND (Railway)
  # =========================
  deploy-backend:
    name: Deploy backend (Railway)
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service Rehearsal
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}


  # =========================
  # DEPLOY FRONTEND (Expo Web)
  # =========================
  deploy-mobile-web:
    name: Deploy mobile web (Expo)
    needs: [mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile deps
        run: npm ci
        working-directory: mobile

      # Build web export
      - name: Export web build
        run: npx expo export --platform web
        working-directory: mobile

      # Deploy using Expo Hosting (THIS is correct)
      - name: Deploy to Expo Hosting
        run: eas deploy --export-dir=dist --prod --non-interactive
        working-directory: mobile