name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # =========================
  # BACKEND LINT
  # =========================
  backend-lint:
    name: Backend (lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend


  # =========================
  # BACKEND UNIT TESTS
  # =========================
  backend-test:
    name: Backend (unit tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Test
        run: npm test
        working-directory: backend


  # =========================
  # MOBILE CI (Expo check)
  # =========================
  mobile:
    name: Mobile (Expo check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile deps
        run: npm ci
        working-directory: mobile

      - name: Expo export check (web)
        run: npx expo export --platform web 
        working-directory: mobile


  # =========================
  # DEPLOY BACKEND (Railway)
  # =========================
  deploy-backend:
    name: Deploy backend (Railway)
    needs: [backend-lint, backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: |
          for i in 1 2 3; do
            railway up --detach --service Bridge && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}


  # =========================
  # DEPLOY FRONTEND (Expo Web)
  # =========================
  deploy-mobile-web:
    name: Deploy mobile web (Expo)
    needs: [mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile deps
        run: npm ci
        working-directory: mobile

      # Build web export
      - name: Export web build
        run: npx expo export --platform web
        working-directory: mobile

      # Deploy using Expo Hosting (THIS is correct)
      - name: Deploy to Expo Hosting
        run: npx eas-cli@latest deploy --export-dir=dist --prod --non-interactive
        working-directory: mobile

  # =========================
  # BUILD FOR ANDROID
  # =========================
  build-android:
    name: Build Android (EAS)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-lint, backend-test, mobile]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Build Android
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        working-directory: mobile